version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: ab_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ab_consultancy_db
      MYSQL_USER: ab_user
      MYSQL_PASSWORD: ab_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ab_api_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ab_user
      DB_PASSWORD: ab_password
      DB_NAME: ab_consultancy_db
      JWT_ACCESS_SECRET: change_in_prod_access_jwt_secret_key_2026
      JWT_REFRESH_SECRET: change_in_prod_refresh_jwt_secret_key_2026
      COOKIE_SECRET: change_in_prod_cookie_signing_secret_2026
      SUPERADMIN_EMAIL: abtaxway@gmail.com
      SUPERADMIN_PASSWORD: ChangeMe@2026#Secure
    depends_on:
      - mysql
    volumes:
      - ./uploads:/app/uploads

volumes:
  mysql_data:
